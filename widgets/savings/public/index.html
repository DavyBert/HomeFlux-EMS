<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HomeFlux Savings</title>
  <style>
    :root {
      --hf-green: #4F8A10;
      --hf-blue: #2f6f8f;
      --hf-orange: #a06b21;
      --hf-purple: #77538e;
      --hf-teal: #4f8a72;
      --hf-red: #8a4f58;
      --hf-muted: var(--homey-text-color-light, rgba(127,127,127,.85));
      --hf-track: rgba(127,127,127,.14);
      --hf-row: rgba(127,127,127,.08);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      overflow: hidden;
      background: var(--homey-background-color, transparent);
      color: var(--homey-text-color, inherit);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .widget { width: 100%; padding: 0; }
    .widget.single { height: 150px; }
    .widget.multi { height: 300px; }
    .widget.show-progress.single { height: 180px; }
    .widget.show-progress.multi { height: 360px; }
    .content { height: 100%; min-height: 0; display: grid; }
    .content.single { grid-template-rows: 150px; }
    .content.multi { grid-template-rows: repeat(2, 150px); }
    .content.show-progress.single { grid-template-rows: 180px; }
    .content.show-progress.multi { grid-template-rows: repeat(2, 180px); }
    .chart-section {
      height: 150px;
      min-height: 0;
      padding: 4px 8px;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 2px;
    }
    .show-progress .chart-section { height: 180px; }
    .header { min-width: 0; }
    .title {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chart-panel {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-columns: 108px minmax(0, 1fr);
      gap: 8px;
      align-items: center;
    }
    .donut-wrap {
      width: 108px;
      height: 108px;
      display: grid;
      place-items: center;
      position: relative;
    }
    .donut {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: var(--hf-track);
    }
    .donut::after {
      content: "";
      position: absolute;
      inset: 19px;
      border-radius: 50%;
      background: var(--homey-background-color, #111);
    }
    .total {
      position: relative;
      z-index: 1;
      max-width: 78px;
      text-align: center;
      font-size: 16px;
      font-weight: 750;
      line-height: 1.05;
      letter-spacing: -0.35px;
      white-space: nowrap;
    }
    .total small { display:block; margin-top:3px; font-size:9px; font-weight:700; letter-spacing:0; opacity:.75; }
    .details {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .legend {
      min-width: 0;
      max-height: 112px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      overflow: hidden;
    }
    .chart-section.with-progress .legend { max-height: none; }
    .row {
      min-width: 0;
      padding: 3px 5px;
      display: grid;
      grid-template-columns: 8px minmax(0,1fr) auto;
      gap: 5px;
      align-items: center;
      border-radius: 7px;
      background: var(--hf-row);
      font-size: 10.5px;
      line-height: 1.1;
    }
    .progress { margin-top: 2px; display: grid; gap: 3px; flex: 0 0 auto; }
    .progress-label { display: flex; justify-content: space-between; gap: 5px; font-size: 10px; line-height: 1.05; color: var(--hf-muted); }
    .progress-value { font-weight: 700; color: var(--homey-text-color, inherit); }
    .progress-bar { height: 7px; border-radius: 999px; overflow: hidden; background: var(--hf-track); }
    .progress-fill { height: 100%; width: 0%; border-radius: 999px; background: linear-gradient(90deg,#4F8A10,#7ecb46); }
    .dot { width: 8px; height: 8px; border-radius: 50%; }
    .label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .value { font-weight: 650; white-space: nowrap; }
    .empty, .error {
      color: var(--hf-muted);
      font-size: 11px;
      line-height: 1.25;
    }
    .error { padding: 4px 8px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="widget single" id="widget">
    <div class="content single" id="content"></div>
    <div class="error hidden" id="error"></div>
  </div>
  <script type="text/javascript">
    const PALETTE = ['#4F8A10','#2f6f8f','#a06b21','#77538e','#4f8a72','#8a4f58'];

    function tr(Homey, key, fallback) {
      try {
        const translated = Homey.__(key);
        return translated && translated !== key ? translated : fallback;
      } catch (_) {
        return fallback;
      }
    }

    function money(value) {
      const amount = Number(value) || 0;
      try {
        return new Intl.NumberFormat(undefined, {
          style: 'currency', currency: 'EUR', minimumFractionDigits: 2, maximumFractionDigits: 2,
        }).format(amount);
      } catch (_) {
        return `€${amount.toFixed(2)}`;
      }
    }

    function buildChart(data, chart, Homey, combineGridCharging = false) {
      if (chart === 'cost') {
        const chargePalette = ['#c084fc','#8b5cf6','#5b21b6','#3b176f','#d8b4fe','#6d28d9'];
        const tariffCharging = Array.isArray(data.batteryCharging?.byTariff) ? data.batteryCharging.byTariff : [];
        const chargingItems = combineGridCharging
          ? [{
              label: tr(Homey, 'widget.savings.gridCharging', 'Grid charging'),
              value: tariffCharging.reduce((sum, item) => sum + (Number(item.cost) || 0), 0),
              kwh: tariffCharging.reduce((sum, item) => sum + (Number(item.kwh) || 0), 0),
              portion: tariffCharging.reduce((sum, item) => sum + (Number(item.kwh) || 0), 0),
              color: '#8b5cf6',
            }]
          : tariffCharging.map((item,index) => ({
              label: `${tr(Homey, 'widget.savings.gridCharging', 'Grid charging')} · ${item.label || ''}`,
              value: Number(item.cost) || 0,
              kwh: Number(item.kwh) || 0,
              portion: Number(item.kwh) || 0,
              color: chargePalette[index % chargePalette.length],
            }));
        return {
          key: 'cost',
          title: tr(Homey, 'widget.savings.cost', 'Cost'),
          total: Number(data.actualCost) || 0,
          totalKwh: Number(data.chartKwh) || 0,
          progress: Number(data.avoidedCostsPercentage) || 0,
          progressKey: 'widget.savings.avoidedEnergyCost',
          progressFallback: 'Avoided energy cost',
          items: [
            { label: tr(Homey, 'widget.savings.directGrid', 'Direct grid use'), value: Number(data.directGrid?.value) || 0, kwh: Number(data.directGrid?.kwh) || 0, portion: Number(data.directGrid?.kwh) || 0, color: '#2f8db5' },
            ...chargingItems,
            { label: tr(Homey, 'widget.savings.directPvFree', 'Direct PV · free'), value: 0, kwh: Number(data.directPv?.kwh) || 0, portion: Number(data.directPv?.kwh) || 0, color: '#287b1d' },
            { label: tr(Homey, 'widget.savings.pvToBatteryFree', 'PV in battery · free'), value: 0, kwh: Number(data.batteryCharging?.pvKwh) || 0, portion: Number(data.batteryCharging?.pvKwh) || 0, color: '#78bd57', alwaysShow: true },
          ],
        };
      }
      return {
        key: 'profit',
        title: tr(Homey, 'widget.savings.netProfit', 'Net profit'),
        total: Number(data.periodSavings) || 0,
        totalKwh: null,
        progress: Number(data.avoidedCostsPercentage) || 0,
        progressKey: 'widget.savings.avoidedCosts',
        progressFallback: 'Avoided costs',
        items: [
          { label: tr(Homey, 'widget.savings.directPv', 'Direct PV'), value: Number(data.directPv?.value) || 0, kwh: Number(data.directPv?.kwh) || 0, portion: Number(data.directPv?.value) || 0, color: '#287b1d' },
          { label: tr(Homey, 'widget.savings.pvBattery', 'PV from battery'), value: Number(data.pvBattery?.value) || 0, kwh: Number(data.pvBattery?.kwh) || 0, portion: Number(data.pvBattery?.value) || 0, color: '#78bd57' },
          { label: tr(Homey, 'widget.savings.loadShift', 'Load shifting'), value: Number(data.loadShift?.value) || 0, kwh: Number(data.loadShift?.kwh) || 0, portion: Number(data.loadShift?.value) || 0, color: '#a06b21' },
        ],
      };
    }

    function chartOrder(mode) {
      if (mode === 'cost_profit') return ['cost', 'profit'];
      if (mode === 'profit_cost') return ['profit', 'cost'];
      return [mode === 'cost' ? 'cost' : 'profit'];
    }

    function renderDonut(target, items) {
      const positive = items.filter(item => Number(item.portion ?? item.value) > 0);
      const sum = positive.reduce((acc, item) => acc + Number(item.portion ?? item.value), 0);
      if (!(sum > 0)) {
        target.style.background = 'var(--hf-track)';
        return;
      }
      let cursor = 0;
      const stops = positive.map(item => {
        const start = cursor;
        cursor += (Number(item.portion ?? item.value) / sum) * 360;
        return `${item.color} ${start.toFixed(2)}deg ${cursor.toFixed(2)}deg`;
      });
      target.style.background = `conic-gradient(${stops.join(',')})`;
    }

    function renderLegend(target, items, Homey) {
      target.innerHTML = '';
      const visible = items.filter(item => item.alwaysShow || Number(item.portion ?? item.value) > 0 || Number(item.value) !== 0);
      if (!visible.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = tr(Homey, 'widget.savings.noData', 'No data for this period yet.');
        target.appendChild(empty);
        return;
      }
      visible.forEach(item => {
        const row = document.createElement('div');
        row.className = 'row';
        const dot = document.createElement('span');
        dot.className = 'dot';
        dot.style.background = item.color;
        const label = document.createElement('span');
        label.className = 'label';
        label.textContent = item.label;
        const value = document.createElement('span');
        value.className = 'value';
        const kwh = Number(item.kwh);
        value.textContent = Number.isFinite(kwh) ? `${money(item.value)} · ${kwh.toFixed(2)} kWh` : money(item.value);
        row.append(dot, label, value);
        target.appendChild(row);
      });
    }

    function renderProgress(target, percent, Homey, labelKey, labelFallback) {
      const safe = Math.max(0, Math.min(100, Number(percent) || 0));
      const block = document.createElement('div');
      block.className = 'progress';
      const label = document.createElement('div');
      label.className = 'progress-label';
      const name = document.createElement('span');
      name.textContent = tr(Homey, labelKey || 'widget.savings.avoidedCosts', labelFallback || 'Avoided costs');
      const value = document.createElement('span');
      value.className = 'progress-value';
      value.textContent = `${safe.toFixed(1)}%`;
      const bar = document.createElement('div');
      bar.className = 'progress-bar';
      const fill = document.createElement('div');
      fill.className = 'progress-fill';
      fill.style.width = `${safe}%`;
      bar.appendChild(fill);
      label.append(name, value);
      block.append(label, bar);
      target.appendChild(block);
    }

    function renderPanel(model, Homey, showProgress) {
      const panel = document.createElement('div');
      panel.className = `chart-panel ${model.key}`;

      const donutWrap = document.createElement('div');
      donutWrap.className = 'donut-wrap';
      const donut = document.createElement('div');
      donut.className = 'donut';
      const total = document.createElement('div');
      total.className = 'total';
      total.textContent = money(model.total);
      if (model.totalKwh !== null && model.totalKwh !== undefined) {
        const small = document.createElement('small');
        small.textContent = `${Number(model.totalKwh || 0).toFixed(2)} kWh`;
        total.appendChild(small);
      }
      donutWrap.append(donut, total);

      const details = document.createElement('div');
      details.className = 'details';
      const legend = document.createElement('div');
      legend.className = 'legend';
      renderDonut(donut, model.items);
      renderLegend(legend, model.items, Homey);
      details.appendChild(legend);
      if (showProgress) renderProgress(details, model.progress, Homey, model.progressKey, model.progressFallback);
      panel.append(donutWrap, details);
      return panel;
    }

    function getSectionHeight(key, showProgress) {
      if (!showProgress) return 150;
      return key === 'cost' ? 220 : 180;
    }

    function renderSection(model, Homey, periodLabel, showProgress) {
      const section = document.createElement('section');
      section.className = `chart-section ${model.key}${showProgress ? ' with-progress' : ''}`;
      section.style.height = `${getSectionHeight(model.key, showProgress)}px`;

      const header = document.createElement('div');
      header.className = 'header';
      const title = document.createElement('div');
      title.className = 'title';
      title.textContent = `${model.title} - ${String(periodLabel || '').toLocaleLowerCase()}`;
      header.appendChild(title);

      section.append(header, renderPanel(model, Homey, showProgress));
      return section;
    }

    async function onHomeyReady(Homey) {
      const settings = Homey.getSettings() || {};
      const validCharts = ['cost', 'profit', 'cost_profit', 'profit_cost'];
      const chart = validCharts.includes(settings.chart) ? settings.chart : 'profit';
      const combined = chart === 'cost_profit' || chart === 'profit_cost';
      const showProgress = String(settings.showProgress || 'show') !== 'hide';
      const combinedProgressTarget = ['cost', 'profit'].includes(String(settings.combinedProgressTarget))
        ? String(settings.combinedProgressTarget) : 'profit';
      const combineGridCharging = String(settings.combineGridCharging || 'no') === 'yes';
      const chartKeys = chartOrder(chart);
      const shouldShowProgress = key => showProgress && (!combined || key === combinedProgressTarget);
      const widgetHeight = chartKeys.reduce((sum, key) => sum + getSectionHeight(key, shouldShowProgress(key)), 0);
      await Homey.ready({ height: widgetHeight });
      const period = ['day', 'month', 'year'].includes(settings.period) ? settings.period : 'day';
      const refreshMinutes = [1, 3, 5, 10, 15].includes(Number(settings.refresh)) ? Number(settings.refresh) : 5;
      const periodLabels = {
        day: tr(Homey, 'widget.savings.day', 'Day'),
        month: tr(Homey, 'widget.savings.month', 'Month'),
        year: tr(Homey, 'widget.savings.year', 'Year'),
      };
      let refreshBusy = false;
      let hasRendered = false;

      async function refresh() {
        if (refreshBusy) return;
        refreshBusy = true;
        try {
          const data = await Homey.api('GET', `/savings?period=${encodeURIComponent(period)}`, {});
          const models = chartOrder(chart).map(key => buildChart(data || {}, key, Homey, combineGridCharging));
          const content = document.getElementById('content');
          const modeClass = models.length > 1 ? 'multi' : 'single';
          const anyProgress = models.some(model => shouldShowProgress(model.key));
          const progressClass = anyProgress ? ' show-progress' : '';
          const widget = document.getElementById('widget');
          widget.className = `widget ${modeClass}${progressClass}`;
          widget.style.height = `${widgetHeight}px`;
          content.className = `content ${modeClass}${progressClass}`;
          content.style.gridTemplateRows = models.map(model => `${getSectionHeight(model.key, shouldShowProgress(model.key))}px`).join(' ');
          content.innerHTML = '';
          models.forEach(model => content.appendChild(renderSection(model, Homey, periodLabels[period], shouldShowProgress(model.key))));
          document.getElementById('error').classList.add('hidden');
          content.classList.remove('hidden');
          hasRendered = true;
        } catch (error) {
          if (!hasRendered) {
            document.getElementById('content').classList.add('hidden');
            const target = document.getElementById('error');
            target.classList.remove('hidden');
            target.textContent = tr(Homey, 'widget.savings.error', 'Savings data is temporarily unavailable.');
          }
          console.error('HomeFlux Savings widget failed', error);
        } finally {
          refreshBusy = false;
        }
      }

      await refresh();
      setInterval(() => {
        if (!document.hidden) refresh();
      }, refreshMinutes * 60 * 1000);
    }
  </script>
</body>
</html>
